[package]
name = "Brainy"
version = "1.1.0"
description = "Brainy"
authors = ["Rami Alkawadri"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "brainy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
tauri = { version = "2.7.0", features = ["test"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
tokio = { version = "1.46.1", features = ["full"] }
sqlx = { version = "0.8.6", features = [ "runtime-tokio", "tls-native-tls", "sqlite", "uuid", "chrono" ] }
sea-orm = { version = "1.1.14", features = [ "sqlx-sqlite", "runtime-tokio-native-tls", "macros" ] }
uuid = { version = "1.17.0", features = [ "v4" ] }
chrono = "0.4.41"
tauri-plugin-dialog = "2.3.0"
dirs = "6.0.0"
regex = "1.11.1"
rand_chacha = "0.9.0"
rand = "0.9.2"
tauri-plugin-opener = "2.4.0"
tauri-plugin-process = "2.3.0"
lol_html = "2.6.0"
thiserror = "2.0.12"
async-trait = "0.1.88"
simple_logger = "5.0.0"
log = "0.4.27"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.3.1"
tauri-plugin-updater = "2.9.0"
tauri-plugin-window-state = "2.4.0"
