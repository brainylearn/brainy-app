[package]
name = "brainy_core"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8.6", features = [ "runtime-tokio", "tls-native-tls", "macros", "sqlite", "chrono", "uuid" ] }
tokio = { version = "1.46.1", features = ["full"] }
async-trait = "0.1.88"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = [ "v4", "serde" ] }
serde_json = "1.0.143"
regex = "1.11.1"
