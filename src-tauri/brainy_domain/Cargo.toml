[package]
name = "brainy_domain"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
thiserror = "2.0.18"
log = "0.4.29"
uuid = { version = "1.23.1", features = [ "v4", "serde" ] }
chrono = { version = "0.4.44", features = ["serde"] }
regex = "1.12.3"
# TODO: should not be in domain!
rig-core = { version = "0.35.0", features = ["pdf", "derive"] }
rig-sqlite = "0.2.4"

# TODO: remove  from domain
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
base64 = "0.22.1"

# TODO: remove
[dev-dependencies]
brainy_test_utils = { path = "../brainy_test_utils" }
mockall = "0.14.0"
